name: Pre-Release

# Every commit on main ships: the static binaries land on a pre-release named
# by the short commit hash, so the layer images can pin a build between
# tagged releases.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - arch: x86_64
          - arch: aarch64
    uses: ./.github/workflows/build.yml
    with:
      arch: ${{ matrix.target.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: selkies-desktop-*
          path: out
          merge-multiple: true

      - name: Get short SHA
        id: sha
        env:
          SHA: ${{ github.sha }}
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.sha.outputs.short }}
          name: ${{ steps.sha.outputs.short }}
          # Tag this commit, not main's head by the time the build finished
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          files: out/*
