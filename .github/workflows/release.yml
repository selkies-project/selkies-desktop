name: Release

# A MAJOR.MINOR.PATCH tag publishes the static binaries as a release whose
# body is release-notes/<tag>.md.  Cargo.toml must carry the same version
# and the notes must exist, or the tag builds nothing.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    name: The tag matches Cargo.toml and has release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version and the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "${version}" != "${TAG}" ]; then
            echo "Cargo.toml carries ${version} but the tag is ${TAG}" >&2
            exit 1
          fi
          if [ ! -s "release-notes/${TAG}.md" ]; then
            echo "release-notes/${TAG}.md is missing" >&2
            exit 1
          fi

  build:
    needs: verify
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - arch: x86_64
          - arch: aarch64
    uses: ./.github/workflows/build.yml
    with:
      arch: ${{ matrix.target.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: selkies-desktop-*
          path: out
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: out/*
