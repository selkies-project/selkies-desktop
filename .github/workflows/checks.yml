name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: Lint the workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflow files
        # actionlint checks the expressions and runs shellcheck over every `run:` block, the
        # releases Selkies' CI lints its own with
        env:
          ACTIONLINT_VERSION: "1.7.12"
          SHELLCHECK_VERSION: "0.11.0"
        run: |
          curl -fsSL --retry 5 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xzf actionlint.tar.gz actionlint
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          PATH="${PWD}:${PATH}" ./actionlint -color

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the build dependencies
        # The same packages README.md names, on the distribution the desktop
        # images are built from
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config \
            libcairo2-dev libwayland-dev libx11-dev libxext-dev wayland-protocols
      - name: Build
        run: make -j"$(nproc)"
      - name: The binary starts and reports the display it lacks
        # A runner has neither a layer-shell compositor nor an X server, so the
        # one thing a headless check can hold the binary to is that it links,
        # runs, and says so rather than crashing
        run: |
          out="$(./selkies-desktop 2>&1 || true)"
          echo "${out}"
          echo "${out}" | grep -q "no Wayland layer shell compositor or X11 display available"
