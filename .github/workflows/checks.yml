name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Lint the workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflow files
        # actionlint checks the expressions and runs shellcheck over every `run:` block, the
        # releases Selkies' CI lints its own with, each checked against its SHA-256 (a version
        # bump takes the hash with it)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          curl -fsSL --retry 5 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" actionlint.tar.gz "${SHELLCHECK_SHA256}" shellcheck.tar.xz | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          PATH="${PWD}:${PATH}" ./actionlint -color

  cargo:
    name: cargo test (${{ matrix.target.arch }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: cargo build and test
        run: cargo build && cargo test

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: The binary starts and reports the display it lacks
        # A runner has neither a layer-shell compositor nor an X server, so the
        # one thing a headless check can hold the binary to is that it runs
        # and says so rather than crashing
        run: |
          out="$(target/debug/selkies-desktop 2>&1 || true)"
          echo "${out}"
          echo "${out}" | grep -q "no Wayland layer shell compositor or X11 display available"
          target/debug/selkies-desktop --version

      - name: The pointer driver builds
        run: cargo build --manifest-path tests/driver/Cargo.toml

  static:
    name: static binary (${{ matrix.target.arch }})
    needs: cargo
    uses: ./.github/workflows/build.yml
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: x86_64
          - arch: aarch64
    with:
      arch: ${{ matrix.target.arch }}

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: pre-commit
        # clippy builds the crate, which the cargo jobs do
        env:
          SKIP: clippy
        run: |
          python3 -m pip install "pre-commit==4.6.*"
          pre-commit run --all-files --show-diff-on-failure
